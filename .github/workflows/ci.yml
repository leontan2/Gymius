name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm audit --audit-level=high
      - run: npm run build
        env:
          FRONTEND_API_URL: https://api.example.invalid

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gymius_test
          POSTGRES_USER: gymius
          POSTGRES_PASSWORD: gymius
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gymius -d gymius_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_URL: jdbc:postgresql://localhost:5432/gymius_test
      POSTGRES_TEST_USERNAME: gymius
      POSTGRES_TEST_PASSWORD: gymius
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: bash ./mvnw --batch-mode --no-transfer-progress clean verify
      - run: docker build --tag gymius-backend:ci .
      - name: Smoke test backend container
        run: |
          container_id=$(docker run --detach --rm --network host \
            --env SERVER_PORT=18080 \
            --env DATABASE_URL=jdbc:postgresql://127.0.0.1:5432/gymius_test \
            --env DATABASE_USERNAME=gymius \
            --env DATABASE_PASSWORD=gymius \
            --env GOOGLE_CLIENT_ID=test-client \
            --env GOOGLE_CLIENT_SECRET=test-secret \
            --env FRONTEND_URL=http://localhost:4200 \
            --env CORS_ALLOWED_ORIGINS=http://localhost:4200 \
            --env MEAL_VISION_PROVIDER=mock \
            gymius-backend:ci)
          trap 'docker stop "$container_id" >/dev/null 2>&1 || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:18080/health; then
              exit 0
            fi
            sleep 2
          done

          docker logs "$container_id"
          exit 1
