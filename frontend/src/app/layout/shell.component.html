<div class="app-shell" [class.nav-open]="navOpen()">
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <aside
    #sidebar
    id="main-navigation"
    class="sidebar"
    aria-label="Main navigation"
    [attr.aria-hidden]="isMobile() && !navOpen() ? 'true' : null"
    [attr.inert]="isMobile() && !navOpen() ? '' : null"
    >
    <a class="brand" routerLink="/dashboard" (click)="closeNav()">
      <span class="brand-mark"><svg lucideIcon="dumbbell" size="24"></svg></span>
      <span>
        <strong>Gymius</strong>
        <small>Train smarter</small>
      </span>
    </a>

    <a class="btn primary new-workout" routerLink="/workouts/new" (click)="closeNav()">
      <svg lucideIcon="plus" size="18"></svg>
      <span>New workout</span>
    </a>

    <nav class="nav-list">
      @for (item of navItems; track item) {
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          [routerLinkActiveOptions]="{ exact: item.path === '/dashboard' }"
          (click)="closeNav()"
          >
          <svg [lucideIcon]="item.icon" size="19"></svg>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="sidebar-footer">
      <button
        class="icon-text-btn"
        type="button"
        [attr.aria-pressed]="theme.theme() === 'light'"
        (click)="theme.toggle()"
        >
        <svg [lucideIcon]="theme.theme() === 'dark' ? 'sun' : 'moon'" size="18"></svg>
        <span>{{ theme.theme() === 'dark' ? 'Light theme' : 'Dark theme' }}</span>
      </button>

      <button
        class="icon-text-btn danger"
        type="button"
        [disabled]="auth.loggingOut()"
        (click)="auth.logout()"
        >
        <svg lucideIcon="log-out" size="18"></svg>
        <span>{{ auth.loggingOut() ? 'Logging out...' : 'Log out' }}</span>
      </button>

      @if (auth.logoutError()) {
        <p class="sidebar-error" role="alert">{{ auth.logoutError() }}</p>
      }

      @if (auth.user(); as user) {
        <div class="user-chip">
          @if (user.pictureUrl) {
            <img
              [src]="user.pictureUrl"
              alt=""
              width="42"
              height="42"
              decoding="async"
              referrerpolicy="no-referrer"
              >
          } @else {
            <span class="avatar-fallback">{{ user.name.charAt(0) }}</span>
          }
          <span>
            <strong>{{ user.name }}</strong>
            <small>{{ user.email }}</small>
          </span>
        </div>
      }
    </div>
  </aside>

  <div class="mobile-bar">
    <a class="mobile-brand" routerLink="/dashboard">
      <svg lucideIcon="dumbbell" size="22"></svg>
      <span>Gymius</span>
    </a>
    <button
      #navToggle
      class="icon-btn"
      type="button"
      [attr.aria-label]="navOpen() ? 'Close navigation' : 'Open navigation'"
      [attr.aria-expanded]="navOpen()"
      aria-controls="main-navigation"
      (click)="toggleNav()"
      >
      <svg [lucideIcon]="navOpen() ? 'x' : 'menu'" size="22"></svg>
    </button>
  </div>

  <button class="nav-scrim" type="button" aria-label="Close navigation" (click)="closeNav(true)"></button>

  <main #mainContent id="main-content" class="content-shell" tabindex="-1">
    <router-outlet></router-outlet>
  </main>
</div>
